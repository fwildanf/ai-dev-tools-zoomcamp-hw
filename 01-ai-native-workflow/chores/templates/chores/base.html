{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Household Chores{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'chores/styles.css' %}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{% url 'chores:index' %}">Household Chores</a>
        <nav>
            <a href="{% url 'chores:index' %}">Dashboard</a>
            <a class="button button-small" href="{% url 'chores:chore_create' %}">Add chore</a>
        </nav>
    </header>
    <main class="container">
        {% if messages %}
            <div class="messages">
                {% for message in messages %}<p class="message">{{ message }}</p>{% endfor %}
            </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
