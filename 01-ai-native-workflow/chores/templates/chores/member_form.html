{% extends 'chores/base.html' %}

{% block title %}{{ title }} | Household Chores{% endblock %}

{% block content %}
<section class="form-shell">
    <p class="eyebrow">Household setup</p>
    <h1>{{ title }}</h1>
    <form method="post" class="stacked-form">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button class="button" type="submit">Save member</button>
            <a href="{% url 'chores:index' %}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
